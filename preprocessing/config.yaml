# preprocessing/config.yaml
# Tham số tiền xử lý LGE chuyên biệt

lge_preprocessing:
  sax:                            # LGE Short-Axis (3D volume)
    target_shape: [192, 192, 16]
    target_spacing: [1.0, 1.0, 10.0]   # mm
    intensity_percentiles: [0.95, 99.5] # clip rồi minmax
    image_interpolation_order: 1        # bilinear
    mask_interpolation_order: 0         # nearest-neighbor

  lax:                            # LGE Long-Axis 2D per-slice (2CH, 4CH, RAS)
    target_shape: [256, 256]
    target_spacing: [1.0, 1.0]         # mm
    intensity_percentiles: null         # minmax đơn giản
    image_interpolation_order: 1
    mask_interpolation_order: 0

# Label maps theo từng view (chuẩn CMR-MULTI)
label_maps:
  lge_sax:
    0: background
    1: lv_cavity
    2: lv_myo
    3: scar
    4: rv_cavity
  lge_2ch:
    0: background
    1: lv_cavity
    2: lv_myo
    3: scar
  lge_4ch:
    0: background
    1: lv_cavity
    2: lv_myo
    3: scar
    4: rv_cavity
  lge_ras:
    0: background
    1: right_atrium

# Đường dẫn dữ liệu
data:
  raw_root: data/LGE_MULTI
  splits_dir: data/processed/splits
  cache_dir: data/processed/cache
