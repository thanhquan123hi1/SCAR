# training/config/base.yaml
# Cấu hình chuẩn Benchmark cho bài toán phân đoạn sẹo LGE

seed: 42
device: auto                  # "auto" = dùng CUDA nếu có, ngược lại CPU

training:
  epochs: 100                 # Chuẩn SOTA: 100-150 epochs
  batch_size: 4
  optimizer: adamw
  learning_rate: 1.0e-4
  weight_decay: 0.01
  augment: true
  in_channels: 1              # 1 cho 2D thông thường / 3 cho 2.5D context
  scheduler:
    name: cosine              # cosine | step | none
    warmup_epochs: 5
    min_lr: 1.0e-6
  sampler:
    enabled: true             # Kích hoạt Weighted Sampler cho lớp sẹo
    rare_classes: [3, 2]      # Class 3: Sẹo, Class 2: Cơ tim
    rare_boost: 2.0           # Tần suất lấy mẫu cân bằng (fixes M5: tránh over-segmentation)
    foreground_boost: 1.3
  early_stopping:
    enabled: true
    monitor: dice_scar        # dice_scar | mean_dice | val_loss
    mode: max                 # max cho dice, min cho loss
    patience: 25              # Tăng patience để tránh dừng sớm
    min_delta: 0.0001

data:
  raw_root: data/LGE_MULTI
  splits_dir: data/processed/splits
  cache_dir: data/processed/cache
  num_workers: 0
  pin_memory: true

loss:
  name: one_vs_rest_compound  # one_vs_rest_compound | focal_tversky | ce_dice
  bce_weight: 0.5
  dice_weight: 0.5
  focal_weight: 1.0
  focal_gamma: 2.0
  # Trọng số phạt dương tính theo từng lớp foreground: [lv, myo, scar] (fixes M1: calibrated weights)
  pos_weight: [1.0, 1.5, 2.0]
  class_weights: [1.0, 1.0, 1.3]

postprocess:
  enabled: true
  use_rules: true             # Giải mã xác suất theo luật ưu tiên
  anatomical_constraint: true # Ràng buộc giải phẫu: Scar bắt buộc nằm trong Myocardium
  dilation_voxels: 1
  tolerance_mm: 2.5           # Hiệu chuẩn dung sai theo milimet
  min_scar_voxels: 5          # Fallback số voxel khi không có spacing
  min_scar_volume_mm3: 15.0   # Ngưỡng thể tích sẹo vật lý (fixes W5: spacing-aware ~0.015 mL)

evaluation:
  metrics: [dice, iou, hd95_mm, scar_mass_g, scar_volume_ml]
  save_predictions: true

outputs:
  run_root: outputs/runs
  report_root: outputs/reports

