model:
  architecture: lightweight_m2_plus
  model_name: Lightweight-ResNet346
  ablation: LIGHTWEIGHT_M2_PLUS
  resnet:
    num_layers: [3, 4, 6]
    width_factor: 1.0
  decoder_channels: [128, 64, 32, 32]
  latent_dim: 256
  fusion_version: spatial_v2
  use_pos_enc: true
  use_skip_gates: true
  use_film: true
  use_cross_attention: true
  sspanet_gate: optimized
  sspanet_reduction: 16
  transformer:
    dropout_rate: 0.0
