# training/config/models/resunet_plus_plus_sax.yaml
# Config cho ResUNet++ 2.5D trên LGE Short-Axis (SAX)

model_name: resunet_plus_plus
view: SAX
task: lge_sax
num_classes: 5               # 0=bg, 1=lv_cavity, 2=lv_myo, 3=scar, 4=rv_cavity

model:
  in_channels: 3              # 2.5D context: [s-1, s, s+1]
  num_classes: 5
  filters: [32, 64, 128, 256, 512]
  one_vs_rest: true

preprocessing:
  target_shape: [192, 192]
  target_spacing: [1.0, 1.0]
  intensity_percentiles: [0.5, 99.5]

loss:
  name: one_vs_rest_compound
  bce_weight: 0.5
  dice_weight: 0.5
  focal_weight: 1.0
  focal_gamma: 2.0
  pos_weight: [1.0, 1.5, 2.0, 1.2]
  class_weights: [1.0, 1.0, 1.3, 1.0]

training:
  batch_size: 4
  learning_rate: 1.0e-4
  in_channels: 3
  epochs: 100
  sampler:
    enabled: true
    rare_classes: [3, 4]
    rare_boost: 2.0
    foreground_boost: 1.3

