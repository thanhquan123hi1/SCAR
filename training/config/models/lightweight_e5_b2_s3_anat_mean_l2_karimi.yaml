model:
  architecture: lightweight_m2_plus
  model_name: Lightweight-E5-B2-S3AnatMean-L2Karimi
  ablation: LIGHTWEIGHT_M2_PLUS
  decoder_channels: [128, 64, 32, 32]
  latent_dim: 256
  fusion_version: spatial_v2
  use_pos_enc: true
  use_skip_gates: true
  use_film: true
  use_cross_attention: false
  sspanet_gate: optimized
  sspanet_reduction: 16
  bottleneck_fusion: multiscale_contrast
  skip_fusion: norm_contrast_anat_mean
  transformer:
    dropout_rate: 0.0

loss:
  hier_dice_weight: 0.20
  boundary_dt_weight: 0.25
  boundary_dt_mode: karimi_mse
  boundary_dt_power: 2.0
  boundary_dt_scale: 16.0
  boundary_dt_max_steps: 32
  boundary_dt_empty_val: 1.0
