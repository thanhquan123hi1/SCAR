# training/config/models/unet_2d_ras.yaml
# Config cho 2D Residual U-Net trên LGE Right Atrium

model_name: unet_2d
view: RAS
task: lge_ras
num_classes: 2               # 0=bg, 1=right_atrium

model:
  in_channels: 1
  num_classes: 2
  features: [32, 64, 128, 256]
  dropout: 0.1

preprocessing:
  target_shape: [256, 256]
  target_spacing: [1.0, 1.0]
  intensity_percentiles: [0.5, 99.5]

loss:
  name: one_vs_rest_compound
  bce_weight: 0.5
  dice_weight: 0.5
  focal_weight: 1.0
  focal_gamma: 2.0
  pos_weight: [2.0]
  class_weights: [1.0]

training:
  batch_size: 8
  learning_rate: 1.0e-4
  epochs: 100
  early_stopping:
    enabled: true
    monitor: val_loss
    mode: min
    patience: 25
