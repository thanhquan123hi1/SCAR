# training/config/models/resunet_plus_plus_2d.yaml
# Config cho ResUNet++ 2.5D (SE-Block, ASPP, Attention Gates) trên LGE 2CH

model_name: resunet_plus_plus
view: 2CH
task: lge_2ch
num_classes: 4               # 0=bg, 1=lv_cavity, 2=lv_myo, 3=scar

model:
  in_channels: 3              # 2.5D context: 3 consecutive slices [s-1, s, s+1]
  num_classes: 4
  filters: [32, 64, 128, 256, 512]
  one_vs_rest: true           # Independent binary foreground heads

preprocessing:
  target_shape: [256, 256]
  target_spacing: [1.0, 1.0]
  intensity_percentiles: [0.5, 99.5]

loss:
  name: one_vs_rest_compound
  bce_weight: 0.5
  dice_weight: 0.5
  focal_weight: 1.0
  focal_gamma: 2.0
  pos_weight: [1.0, 1.5, 2.0]
  class_weights: [1.0, 1.0, 1.3]

training:
  batch_size: 4
  learning_rate: 1.0e-4
  in_channels: 3
  epochs: 100
  sampler:
    enabled: true
    rare_classes: [3, 2]
    rare_boost: 2.0
    foreground_boost: 1.3

