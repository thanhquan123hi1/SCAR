# training/config/models/unet_2d_4ch.yaml
# Config cho 2D Residual U-Net trên LGE 4-Chamber

model_name: unet_2d
view: 4CH
task: lge_4ch
num_classes: 5               # 0=bg, 1=lv_cavity, 2=lv_myo, 3=scar, 4=rv_cavity

model:
  in_channels: 1
  num_classes: 5
  features: [32, 64, 128, 256]
  dropout: 0.1

preprocessing:
  target_shape: [256, 256]
  target_spacing: [1.0, 1.0]
  intensity_percentiles: [0.5, 99.5]

loss:
  name: one_vs_rest_compound
  bce_weight: 0.5
  dice_weight: 0.5
  focal_weight: 0.4
  focal_gamma: 2.0
  pos_weight: [1.5, 2.0, 3.0, 1.8]
  class_weights: [1.0, 1.2, 1.6, 1.2]

training:
  batch_size: 8
  learning_rate: 1.0e-4
  epochs: 100
  early_stopping:
    enabled: true
    monitor: val_loss
    mode: min
    patience: 25
