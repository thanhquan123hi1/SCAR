model:
  architecture: lightweight_m2_plus
  model_name: Lightweight-E5-B1R-S3-L6-CalibFarFP
  ablation: LIGHTWEIGHT_M2_PLUS
  decoder_channels: [128, 64, 32, 32]
  latent_dim: 256
  fusion_version: spatial_v2
  use_pos_enc: true
  use_skip_gates: true
  use_film: true
  use_cross_attention: false
  sspanet_gate: optimized
  sspanet_reduction: 16
  bottleneck_fusion: residual_contrast
  skip_fusion: norm_contrast
  transformer:
    dropout_rate: 0.0

loss:
  ce_weight: 0.45
  dice_weight: 0.55
  ce_class_weights: [0.80, 1.10, 0.75, 1.15]
  dice_class_weights: [0.5, 1.15, 0.70, 1.15]
  hier_dice_weight: 0.25
  ring_tversky_beta: 0.62
  aar_tversky_beta: 0.38
  boundary_dt_weight: 0.35
  boundary_dt_mode: hybrid_karimi_farfp
  boundary_dt_power: 2.0
  boundary_dt_scale: 14.0
  boundary_dt_max_steps: 32
  boundary_dt_empty_val: 2.0
  boundary_dt_margin: 4.0
